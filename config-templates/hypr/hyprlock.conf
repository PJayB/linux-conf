# hyprlock: lock screen for niri, matched to the waybar palette.
#
# Designed to read unambiguously as a lock screen: a dimmed, blurred desktop
# behind glass, a "Locked" label with a lock icon, the user's name, a clock,
# and a password field that is always visible (not only once you type).

$bg     = rgb(1d2021)
$bg_alt = rgb(2a2e30)
$fg     = rgb(d4d4d4)
$dim    = rgb(7a7a7a)
$accent = rgb(7fc8ff)
$warn   = rgb(e5c07b)
$crit   = rgb(e06c75)
$good   = rgb(98c379)
$font   = Iosevka Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Blurred, darkened screenshot of the desktop; falls back to the bar colour.
background {
    monitor =
    path = screenshot
    color = $bg
    blur_passes = 3
    blur_size = 7
    brightness = 0.5
}

# Clock
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = $dim
    font_size = 20
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
}

# Explicit "this is a lock screen" signifier
label {
    monitor =
    text =   Locked
    color = $accent
    font_size = 22
    font_family = $font
    position = 0, 30
    halign = center
    valign = center
}

# Whose session this is
label {
    monitor =
    text = $USER
    color = $fg
    font_size = 16
    font_family = $font
    position = 0, -20
    halign = center
    valign = center
}

# Password field: always shown, with placeholder text so it reads as an input
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 8
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $bg_alt
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##7a7a7a">Enter password to unlock</span>
    check_color = $warn
    fail_color = $crit
    fail_text = <i>Wrong password ($ATTEMPTS)</i>
    capslock_color = $warn
    position = 0, -90
    halign = center
    valign = center
}

# Caps Lock / layout hint under the field
label {
    monitor =
    text = cmd[update:500] [ "$(cat /sys/class/leds/*::capslock/brightness 2>/dev/null | sort -r | head -1)" = 1 ] && echo "Caps Lock is on" || echo ""
    color = $warn
    font_size = 13
    font_family = $font
    position = 0, -145
    halign = center
    valign = center
}
