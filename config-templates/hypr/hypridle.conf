# hypridle: idle handling for niri.
#
# Lock after 5 min idle, blank screens 30 s later, and lock before suspend
# (lid close/suspend itself is handled by logind as usual). Respects Wayland
# idle-inhibit, D-Bus ScreenSaver and systemd inhibitors (video, calls, etc).

general {
    # Everything that locks goes through logind, which calls this
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors

    # Hold off suspend until the lock screen is actually up, so the desktop
    # never flashes on resume
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}
